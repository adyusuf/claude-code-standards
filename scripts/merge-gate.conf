# Settings for the shared gate core (scripts/gate-core.sh).
# See scripts/README.md.
#
# ⚠️ This repository had NO conf file at all until 21/09/2026, while all eight
# project repositories had one. The gate therefore reported GATE INCOMPLETE on
# every run — three steps had nowhere to read their command from. "Incomplete"
# was the correct verdict, but nothing was going to change it on its own.

COVERAGE_MIN=80

# Coverage is measured, not waived — scripts/coverage.sh, and `coverage` can not
# be listed as an accepted gap at all (the core refuses it by name, rule #29).
# Measured 21/09/2026, BOTH codebases above the threshold:
#   Python  1,171/1,455 = 80.0%   320 tests
#   Shell     403/488   = 82.6%   164 kcov-traced runs
# The shell number exists at all only because the tests were changed to run the
# ORIGINAL scripts instead of copies; the reason is in scripts/coverage-shell.sh.

# SAST: installed 21/09/2026 (rule #19). CodeQL over the Python; a finding whose
# rule carries security-severity >= 7.0 blocks the merge. CI must call this same
# script with the same threshold — never two different rules in two places.
# ⚠️ The shell scripts are NOT covered by it (CodeQL has no shell analyser) and
# the script says so on every run rather than leaving it to be assumed.
SAST_CMD="bash scripts/codeql-scan.sh"

# The two remaining gaps are NOT "not installed yet" — they do not apply to this
# repository at all, and the reason is recorded so that a future reader does not
# have to re-derive it:
#
#   backward-compatibility scan — this repository has NO API and NO database. It
#     is a set of rules, standards, agent definitions and gate scripts. There is
#     no contract to evolve additively, so there is nothing for #4's scan to
#     read. If an API is ever added here, this entry must go.
#
#   e2e spec check — there is no running application, so there can be no e2e
#     suite (#33). The gate's own check only asks "was a spec written for a
#     behaviour change", which presupposes a product with behaviour to drive.
#     The scripts' behaviour IS covered, by 320 unit tests.
#
# ⚠️ Neither entry is a deferral, so neither carries a date to revisit. An entry
# that means "later" belongs in a project's own notes with a date — and
# `coverage` and `SAST` were both removed from this list rather than left here.
ACCEPTED_GAPS="backward-compatibility scan|e2e spec check|e2e: this project has no e2e suite"
ACCEPTED_GAPS_REASON="21/09/2026: this repository has no API, no database and no running application — the backward-compatibility scan and the e2e spec check have nothing to read here. They are inapplicable, not deferred. Coverage and SAST are NOT in this list: both are measured (scripts/coverage.sh, scripts/codeql-scan.sh). The prod-path e2e step is accepted for the same reason as the spec check: there is no running application to drive, and the scripts' own behaviour is covered by unit tests. The promotion itself stays a manual, user-made decision."

# No test tier: the configuration repository's `test` branch is a promotion
# stage, not a deployed environment, so the prod gate cannot verify "is this code
# on test" by asking a running service.
#
# ⚠️ This used to read "rule #33's prod path stays blocked here on purpose", and
# that was only half a decision. The prod gate reported GATE INCOMPLETE on every
# run, and "promotion is done by hand" is exactly the sentence a skipped gate gets
# waved through with. A gate that can never go green is a gate nobody reads — the
# failure mode #19 exists to prevent.
#
# So the prod-path gap is stated the same way the other two are: by name, with its
# reason, in ACCEPTED_GAPS. The third entry matches the prod e2e step's own message
# and nothing else — a bare `e2e` pattern would have waived any e2e gap in any
# project that copies this file.
#
# What is NOT waived: coverage and SAST still run and still block. Accepting the
# gap removes a false INCOMPLETE; it does not make the promotion automatic, which
# stays the user's decision (#26).
# no test tier
