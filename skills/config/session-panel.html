<title>Session Settings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column that fits a side panel; three boxes (Settings, Agents, Promotion) under a header, and a bar
   at the bottom that stays in view while changes are staged. Palette: warm paper and ink with one copper accent. */
:root {
  --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1f23; --muted: #666a72; --line: #dcdad2;
  --accent: #a4491f; --accent-ink: #ffffff; --accent-soft: #f6e6dc; --ok: #2f6b3f; --warn: #8a5a00;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b; --surface: #1f2125; --ink: #ecebe6; --muted: #9a9ea6; --line: #33363c;
    --accent: #e08a5c; --accent-ink: #1a1007; --accent-soft: #3a2a20; --ok: #7bc08c; --warn: #e0b04c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17181b; --surface: #1f2125; --ink: #ecebe6; --muted: #9a9ea6; --line: #33363c;
  --accent: #e08a5c; --accent-ink: #1a1007; --accent-soft: #3a2a20; --ok: #7bc08c; --warn: #e0b04c; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans);
  padding-block: 20px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); }
code, .mono { font-family: var(--mono); font-size: 12px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
.box > summary { list-style: none; cursor: pointer; padding: 12px 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; }
.box > summary::-webkit-details-marker { display: none; }
.box > summary .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
.box .body { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 14px; }
h2 { margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 2px 0 2px 8px; border-left: 3px solid transparent; }
.row.changed { border-left-color: var(--accent); background: var(--accent-soft); }
.row label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; cursor: pointer; overflow-wrap: anywhere; }
.row .was { color: var(--muted); font-size: 12px; white-space: nowrap; }
.row .src { color: var(--muted); font-size: 11px; font-family: var(--mono); }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
select { font: inherit; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; max-width: 48%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.agent { display: flex; flex-direction: column; gap: 2px; }
.agent .sub { padding-left: 36px; color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stage { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.stage:last-child { border-bottom: 0; }
.waived { color: var(--warn); font-size: 12px; overflow-wrap: anywhere; }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar .in { max-width: 600px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.bar .msg { flex: 1 1 200px; min-width: 0; color: var(--muted); font-size: 13px; }
.bar .msg.ok { color: var(--ok); }
button { font: inherit; font-weight: 600; font-size: 13px; border-radius: 5px; padding: 7px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
textarea { width: 100%; font: 12px/1.4 var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px; min-height: 84px; }
.note { color: var(--muted); font-size: 12px; margin: 0; }
@media (prefers-reduced-motion: no-preference) { .row { transition: background 120ms; } }
</style>

<main>
  <header>
    <h1>Session Settings</h1>
    <p>Changes here apply to <strong>this session only</strong>. A new session starts from your saved defaults.</p>
    <p class="mono" id="session"></p>
  </header>
  <details class="box" open><summary>Settings <span class="hint" id="settings-hint"></span></summary><div class="body" id="settings"></div></details>
  <details class="box" open><summary>Agents <span class="hint" id="agents-hint"></span></summary><div class="body" id="agents"></div></details>
  <details class="box"><summary>Promotion <span class="hint">read-only, as of publishing</span></summary><div class="body" id="promotion"></div></details>
  <details class="box" id="manual-box" hidden><summary>Copy the changes <span class="hint">if sending is not available</span></summary>
    <div class="body"><p class="note">Give this to Claude, or run it yourself with <code>adyusuf_config.py apply --session &lt;id&gt; -</code>.</p><textarea id="manual" readonly></textarea></div></details>
</main>
<div class="bar"><div class="in">
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <button type="button" id="reset" disabled>Undo</button>
  <button type="button" id="send" class="primary" disabled>Apply to this session</button>
</div></div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var staged = {};      // key -> wanted value, only where it differs from what the session has now
  var canSend = false;

  function $(id) { return document.getElementById(id); }
  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') node.textContent = attrs[k]; else if (k === 'class') node.className = attrs[k]; else node.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (kid) { node.appendChild(kid); });
    return node;
  }
  function shown(v) { return v === true ? 'yes' : v === false ? 'no' : String(v); }
  function current(key) { return Object.prototype.hasOwnProperty.call(staged, key) ? staged[key] : D.values[key]; }
  function stage(key, value) {
    if (value === D.values[key]) delete staged[key]; else staged[key] = value;
    refresh();
  }
  function enabledFor(wantActive, inMode) { return wantActive ? (inMode ? 'auto' : 'on') : (inMode ? 'off' : 'auto'); }

  function row(key, label, control, extra) {
    var changed = Object.prototype.hasOwnProperty.call(staged, key);
    var r = el('div', { class: 'row' + (changed ? ' changed' : ''), 'data-key': key });
    r.appendChild(control);
    var src = D.sources[key];
    if (src && src !== 'default') r.appendChild(el('span', { class: 'src', text: src }));
    if (changed) r.appendChild(el('span', { class: 'was', text: 'was ' + shown(D.values[key]) }));
    return r;
  }

  function boolControl(spec) {
    var box = el('input', { type: 'checkbox', id: 'k-' + spec.key });
    box.checked = current(spec.key) === true;
    box.addEventListener('change', function () { stage(spec.key, box.checked); });
    return el('label', { 'for': 'k-' + spec.key }, [box, el('span', { text: spec.label })]);
  }
  function enumControl(spec) {
    var id = 'k-' + spec.key;
    var sel = el('select', { id: id });
    spec.options.forEach(function (o) { var op = el('option', { value: o, text: o }); if (String(current(spec.key)) === o) op.selected = true; sel.appendChild(op); });
    sel.addEventListener('change', function () { stage(spec.key, sel.value); });
    return el('label', { 'for': id }, [el('span', { text: spec.label }), sel]);
  }

  function renderSettings() {
    var host = $('settings'); host.textContent = '';
    var groups = [];
    D.schema.forEach(function (s) { if (s.group !== 'Agents' && groups.indexOf(s.group) < 0) groups.push(s.group); });
    groups.forEach(function (g) {
      var section = el('section', {}, [el('h2', { text: g })]);
      D.schema.filter(function (s) { return s.group === g; }).forEach(function (spec) {
        section.appendChild(row(spec.key, spec.label, spec.type === 'bool' ? boolControl(spec) : enumControl(spec)));
      });
      host.appendChild(section);
    });
  }

  function renderAgents() {
    var host = $('agents'); host.textContent = '';
    var mode = String(current('mode'));
    $('agents-hint').textContent = 'mode ' + mode + (mode === 'A' ? ': no agents' : '');
    D.agents.forEach(function (a) {
      var onKey = 'agents.' + a.role + '.enabled', modelKey = 'agents.' + a.role + '.model';
      var enabled = current(onKey);
      var active = mode === 'A' ? false : (enabled === 'auto' ? a.in_mode : enabled === 'on');
      var box = el('input', { type: 'checkbox', id: 'a-' + a.role });
      box.checked = active; box.disabled = mode === 'A';
      box.addEventListener('change', function () { stage(onKey, enabledFor(box.checked, a.in_mode)); });
      var changed = Object.prototype.hasOwnProperty.call(staged, onKey) || Object.prototype.hasOwnProperty.call(staged, modelKey);
      var wrap = el('div', { class: 'agent' });
      var top = el('div', { class: 'row' + (changed ? ' changed' : '') }, [el('label', { 'for': 'a-' + a.role }, [box, el('span', { text: a.role + (!a.in_mode && active ? ' (added)' : '') + (a.in_mode && !active && mode !== 'A' ? ' (off)' : '') })])]);
      wrap.appendChild(top);
      if (active) {
        var sel = el('select', { id: 'm-' + a.role, 'aria-label': a.role + ' model' });
        ['default', 'opus', 'sonnet', 'haiku', 'fable'].forEach(function (o) {
          var op = el('option', { value: o, text: o === 'default' ? 'default (' + a.runs_on + ')' : o });
          if (String(current(modelKey)) === o) op.selected = true; sel.appendChild(op);
        });
        sel.addEventListener('change', function () { stage(modelKey, sel.value); });
        wrap.appendChild(el('div', { class: 'sub' }, [el('span', { text: 'model, defined ' + a.defined }), sel]));
      }
      host.appendChild(wrap);
    });
  }

  function renderPromotion() {
    var host = $('promotion'); host.textContent = '';
    if (!D.promotion.length) { host.appendChild(el('p', { class: 'note', text: 'No dev, test or prod branch was found when this page was made.' })); return; }
    D.promotion.forEach(function (s) {
      var line = el('div', { class: 'stage' }, [el('span', { class: 'mono', text: s.branch }), el('span', { class: 'mono', text: 'origin ' + s.origin })]);
      host.appendChild(line);
      (s.waived || []).forEach(function (w) { host.appendChild(el('div', { class: 'waived', text: 'waived ' + w })); });
    });
  }

  function message() {
    var keys = Object.keys(staged);
    var payload = {}; keys.forEach(function (k) { payload[k] = staged[k]; });
    return 'Apply these adyusuf settings to THIS SESSION ONLY (session ' + D.session + '). Do not change the saved defaults.\n' +
      'Validate with: adyusuf_config.py apply --session ' + D.session + ' -\n' + JSON.stringify(payload, null, 2);
  }

  function refresh() {
    var n = Object.keys(staged).length;
    var focused = document.activeElement && document.activeElement.id;
    renderSettings(); renderAgents();
    if (focused && $(focused)) $(focused).focus();
    $('send').disabled = !(n > 0 && canSend); $('reset').disabled = n === 0;
    $('manual-box').hidden = !(n > 0 && !canSend);
    if (n > 0 && !canSend) $('manual').value = message();
    var m = $('msg'); m.className = 'msg';
    m.textContent = n === 0 ? 'No changes yet.' : n + (n === 1 ? ' change' : ' changes') + ' staged' + (canSend ? '.' : '. Sending to Claude is not available here: copy them below.');
    $('settings-hint').textContent = n ? n + ' staged' : '';
  }

  $('reset').addEventListener('click', function () { staged = {}; refresh(); });
  $('send').addEventListener('click', function () {
    var button = $('send'), m = $('msg');
    button.disabled = true; m.textContent = 'Sending to Claude…';
    window.claude.use('comments').then(function (comments) {
      if (!comments) throw new Error('unavailable');
      return comments.anchorFor(button).then(function (anchor) { return comments.sendToClaude({ anchor: anchor, text: message() }); });
    }).then(function () {
      m.className = 'msg ok'; m.textContent = 'Sent. Claude applies it to this session and refreshes this page.';
    }).catch(function (error) {
      button.disabled = false; canSend = false; refresh();
      m.textContent = 'Could not send (' + ((error && error.code) || (error && error.message) || 'error') + '). Copy the changes below.';
    });
  });

  $('session').textContent = 'session ' + D.session + ' · made ' + D.made;
  renderPromotion(); refresh();
  if (window.claude && window.claude.use) {
    window.claude.use('comments').then(function (comments) {
      if (!comments || !comments.canSendToClaude) return null;
      return comments.canSendToClaude();
    }).then(function (answer) { canSend = answer === 'available'; refresh(); }).catch(function () { refresh(); });
  }
})();
</script>
